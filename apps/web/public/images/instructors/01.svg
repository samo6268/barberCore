      <stop offset="100%" stop-color="#4B244A"/>
    </linearGradient>
    <linearGradient id="ov" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2A1A2E" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2A1A2E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circle">
