<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" width="1400" height="1800">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1A2E"/>
      <stop offset="40%" stop-color="#4B244A"/>
      <stop offset="100%" stop-color="#7B3F5E"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C49A3C" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#C49A3C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C49A3C" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1800" fill="url(#g)"/>
  <rect width="1400" height="1800" fill="url(#shine)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="300" r="400" fill="#7B3F5E" fill-opacity="0.15"/>
  <circle cx="1200" cy="1500" r="500" fill="#2A1A2E" fill-opacity="0.3"/>
  <circle cx="700" cy="900" r="600" fill="#4B244A" fill-opacity="0.1"/>
  <!-- Gold accent line -->
  <line x1="560" y1="820" x2="840" y2="820" stroke="#C49A3C" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="560" y1="980" x2="840" y2="980" stroke="#C49A3C" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Text -->
  <text x="700" y="880" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#F9F5F0" fill-opacity="0.9" letter-spacing="8">پرنگارین</text>
  <text x="700" y="940" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C49A3C" fill-opacity="0.8" letter-spacing="4">BEAUTY &amp; SALON</text>
</svg>
