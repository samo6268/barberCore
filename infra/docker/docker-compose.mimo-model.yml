# Optional, explicitly started after a capacity/latency check. Not included by deploy-mimo.sh.
services:
  ollama:
    image: ${MIMO_OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: '2m'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - mimo_models:/root/.ollama
    networks:
      - app
volumes:
  mimo_models:
networks:
  app:
    external: true
    name: barbercore_network
